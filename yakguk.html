<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>고양시 약국 지도</title>
    <style>
        body {
            margin: 0;
            padding: 0;
        }
        /* 지도가 전체 화면을 차지하도록 설정 */
        #map {
            width: 100%;
            height: 100vh;
        }
        /* 인포윈도우 스타일 */
        .info-window {
            padding: 5px;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- 지도를 표시할 div -->
    <div id="map"></div>

    <!-- 카카오맵 API 로드 (services 라이브러리 포함 필수) -->
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=0284f30d15a21cd8c8d334026cc26d3b&libraries=services"></script>
    
    <script>
        // 1. 지도 초기 설정
        var mapContainer = document.getElementById('map'), 
            mapOption = { 
                // 고양시청 인근을 초기 중심 좌표로 설정
                center: new kakao.maps.LatLng(37.6583599, 126.8320201), 
                level: 5 // 지도의 확대 레벨
            };

        // 지도를 생성합니다
        var map = new kakao.maps.Map(mapContainer, mapOption); 

        // 장소 검색 객체를 생성합니다
        var ps = new kakao.maps.services.Places(map); 

        // 지도에 표시된 마커를 담을 배열입니다
        var markers = [];

        // 마커 클릭 시 약국 이름을 보여줄 인포윈도우입니다
        var infowindow = new kakao.maps.InfoWindow({zIndex:1});

        // 2. 약국 검색 함수 (카테고리 코드: PM9)
        function searchPharmacies() {
            // 현재 지도의 영역(bounds)을 기준으로 약국 카테고리 검색을 요청합니다
            ps.categorySearch('PM9', placesSearchCB, {useMapBounds:true}); 
        }

        // 장소 검색 완료 시 호출되는 콜백 함수입니다
        function placesSearchCB(data, status, pagination) {
            if (status === kakao.maps.services.Status.OK) {
                // 정상적으로 검색이 완료되면 지도에 마커를 표출합니다
                displayPlaces(data);
            } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
                // 검색 결과가 없는 경우 기존 마커를 지웁니다
                removeMarker();
            }
        }

        // 3. 지도에 마커를 표출하는 함수입니다
        function displayPlaces(places) {
            removeMarker(); // 기존 마커 제거

            for (var i = 0; i < places.length; i++) {
                displayMarker(places[i]);
            }
        }

        // 마커를 생성하고 지도에 표시하는 함수입니다
        function displayMarker(place) {
            var marker = new kakao.maps.Marker({
                map: map,
                position: new kakao.maps.LatLng(place.y, place.x) 
            });

            // 마커에 클릭 이벤트를 등록합니다
            kakao.maps.event.addListener(marker, 'click', function() {
                var content = '<div class="info-window">' + place.place_name + '</div>';
                infowindow.setContent(content);
                infowindow.open(map, marker);
            });

            markers.push(marker);
        }

        // 지도 위에 표시되고 있는 마커를 모두 제거하는 함수입니다
        function removeMarker() {
            for (var i = 0; i < markers.length; i++) {
                markers[i].setMap(null);
            }
            markers = [];
        }

        // 4. 이벤트 등록: 지도를 이동하거나 확대/축소할 때마다 새롭게 약국을 검색합니다
        kakao.maps.event.addListener(map, 'idle', searchPharmacies);

        // 초기 화면 로드 시 약국 검색 실행
        searchPharmacies();
    </script>
</body>
</html>
